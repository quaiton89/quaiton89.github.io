<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="점점스튜디오 - 일상에서 쓰는 모바일 앱을 만들고, 꾸준히 다듬습니다.">
    <meta name="google-site-verification" content="a28Bxv_YlzX2OOwpmFlpAVYC38b__B3_QPGEHYwltKQ">
    <title>점점스튜디오</title>
    <link rel="icon" type="image/svg+xml" href="images/mark.svg">
    <link rel="apple-touch-icon" href="images/mark.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --bg: #FFFFFF;
            --ink: #111111;
            --muted: #666666;
            --line: #E5E5E5;
            --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--sans);
            color: var(--ink);
            background: var(--bg);
            word-break: keep-all;
        }

        a {
            color: inherit;
        }

        .page {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand img {
            width: 28px;
            height: 28px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 0;
        }

        h1 {
            font-size: clamp(2rem, 5.6vw, 4.25rem);
            font-weight: 700;
            line-height: 1.28;
            letter-spacing: -0.035em;
        }

        main p {
            margin-top: 28px;
            font-size: 17px;
            line-height: 1.7;
            color: var(--muted);
        }

        .apps {
            padding-bottom: 40px;
        }

        .apps h2 {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
        }

        .apps ul {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px 32px;
            margin-top: 16px;
            list-style: none;
        }

        .apps li a,
        .apps li > span {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .apps img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1px solid var(--line);
        }

        .apps small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
        }

        .featured {
            padding-bottom: 56px;
        }

        .featured ul {
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
        }

        .featured li a {
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            height: 100%;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 16px;
            font-size: 17px;
            background: var(--bg);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .featured li a:hover,
        .featured li a:focus-visible {
            transform: translateY(-4px);
            border-color: transparent;
            box-shadow: 0 2px 6px rgba(17, 17, 17, 0.05), 0 14px 32px rgba(17, 17, 17, 0.10);
        }

        .featured img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .featured li a:hover img,
        .featured li a:focus-visible img {
            transform: scale(1.06) rotate(-3deg);
        }

        .apps:not(.featured) li a {
            margin: -8px;
            padding: 8px;
            border-radius: 14px;
            transition: background-color 0.2s ease;
        }

        .apps:not(.featured) li a img {
            transition: transform 0.2s ease;
        }

        .apps:not(.featured) li a:hover,
        .apps:not(.featured) li a:focus-visible {
            background: #F5F5F5;
        }

        .apps:not(.featured) li a:hover img,
        .apps:not(.featured) li a:focus-visible img {
            transform: scale(1.05);
        }

        @media (prefers-reduced-motion: reduce) {
            .apps a,
            .apps img {
                transition: none !important;
            }

            .featured li a:hover,
            .featured li a:focus-visible,
            .apps li a:hover img,
            .apps li a:focus-visible img {
                transform: none;
            }
        }

        .featured small {
            margin-top: 4px;
            font-size: 13px;
            line-height: 1.5;
        }

        .apps .soon {
            display: inline-block;
            margin-left: 4px;
            padding: 1px 8px;
            border-radius: 999px;
            background: #C4532A;
            color: #FFFFFF;
            font-size: 11px;
            font-style: normal;
            font-weight: 700;
            letter-spacing: 0.02em;
            vertical-align: 2px;
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding-top: 24px;
            border-top: 1px solid var(--ink);
            font-size: 14px;
            color: var(--muted);
        }

        footer a {
            color: var(--ink);
            font-size: 17px;
            font-weight: 600;
            text-underline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <span class="brand"><img src="images/mark.svg" alt="">점점스튜디오</span>
        </header>

        <main>
            <h1>생활에 필요한 작은 도구를<br>만듭니다.</h1>
            <p>점점스튜디오는 일상에서 쓰는 모바일 앱을 만들고, 꾸준히 다듬고 있습니다.</p>
        </main>

        <section class="apps featured" aria-labelledby="featured-title">
            <h2 id="featured-title">대표 앱</h2>
            <ul>
                <li><a href="https://play.google.com/store/apps/details?id=com.MyDays.lifelog"><img src="images/apps/days.png" alt=""><span>Days<small>중요한 날을 세는 디데이 위젯</small></span></a></li>
                <li><a href="https://play.google.com/store/apps/details?id=com.chagokchagok.lifelog"><img src="images/apps/chagok.png" alt=""><span>차곡차곡<small>용돈 기입장과 저축 챌린지</small></span></a></li>
                <li><a href="https://play.google.com/store/apps/details?id=com.weighttracker.lifelog"><img src="images/apps/harucheck.png" alt=""><span>하루체크<small>체중 기록과 간헐적 단식 타이머</small></span></a></li>
                <li><a href="https://play.google.com/store/apps/details?id=com.kkotdal.cycle"><img src="images/apps/kkotdal.png" alt=""><span>꽃달<small>생리 주기 다이어리</small></span></a></li>
                <li><a href="https://play.google.com/store/apps/details?id=com.jinannal.camera"><img src="images/apps/filmharu.png" alt=""><span>필름하루<small>찍는 순간 필름 사진이 되는 빈티지 카메라</small></span></a></li>
            </ul>
        </section>

        <section class="apps" aria-labelledby="apps-title">
            <h2 id="apps-title">다른 앱</h2>
            <ul>
                <li><a href="https://play.google.com/store/apps/details?id=com.goun.camera"><img src="images/apps/goun.png" alt=""><span>고운<small>자연스러운 뷰티 카메라</small></span></a></li>
                <li><a href="https://play.google.com/store/apps/details?id=com.gapja.saju"><img src="images/apps/gapja.png" alt=""><span>갑자<small>근거를 보여주는 사주·운세</small></span></a></li>
            </ul>
        </section>

        <footer>
            <a href="mailto:jeomcoder@outlook.com">jeomcoder@outlook.com</a>
            <span>© 2026 점점스튜디오</span>
        </footer>
    </div>
</body>
</html>
